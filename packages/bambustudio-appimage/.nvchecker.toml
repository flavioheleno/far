[bambustudio-appimage]
source = "upstream"
mode = "github-assets"
github = "bambulab/BambuStudio"
include_prereleases = true
# Four zero-padded components; other tag schemes (legacy, nightly) are ignored.
tag_pattern = 'v(\d{2}\.\d{2}\.\d{2}\.\d{2})'
hosts = ["github.com", "release-assets.githubusercontent.com", "objects.githubusercontent.com"]
assignments = ["pkgver", "_url"]

[[bambustudio-appimage.sources]]
variable = "_url"
array = "sha256sums"
index = 0
algorithm = "sha256"
asset_pattern = 'BambuStudio_(?:ubu24|ubuntu-?24\.04)-{tag}-\d{14}\.AppImage'
