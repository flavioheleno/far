[extrudo-appimage]
source = "upstream"
mode = "github-assets"
github = "zoltanf/extrudo"
include_prereleases = false
tag_pattern = 'v(\d+\.\d+\.\d+)'
hosts = ["github.com", "release-assets.githubusercontent.com", "objects.githubusercontent.com"]
assignments = ["pkgver", "_url"]

[[extrudo-appimage.sources]]
variable = "_url"
array = "sha256sums"
index = 0
algorithm = "sha256"
asset_pattern = 'extrudo-{version}-linux-x86_64\.AppImage'
