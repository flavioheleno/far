[spotify]
source = "upstream"
mode = "debian"
hosts = ["repository.spotify.com", "download.spotify.com"]
assignments = ["pkgver", "_commit", "_url"]
package = "spotify-client"
base_url = "https://repository.spotify.com/"
release_url = "https://repository.spotify.com/dists/testing/Release"
# The fetched key must match PKGBUILD validpgpkeys.
signing_key_url = "https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.gpg"
prerelease = true

[[spotify.sources]]
variable = "_url"
array = "sha512sums"
index = 0
algorithm = "sha512"
architecture = "amd64"
index_url = "https://repository.spotify.com/dists/testing/non-free/binary-amd64/Packages"
release_path = "non-free/binary-amd64/Packages"
