[enpass-bin]
source = "upstream"
mode = "debian"
hosts = ["apt.enpass.io"]
assignments = ["pkgver", "_url"]
package = "enpass"
base_url = "https://apt.enpass.io/"
release_url = "https://apt.enpass.io/"

[[enpass-bin.sources]]
variable = "_url"
array = "sha256sums"
index = 0
algorithm = "sha256"
index_url = "https://apt.enpass.io/dists/stable/main/binary-amd64/Packages"
architecture = "amd64"
